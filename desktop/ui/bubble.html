<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="color-scheme" content="dark">
  <title>Dexter says</title>
  <link rel="stylesheet" href="./panel.css">
</head>
<body class="bubble-window">
  <section class="float-bubble" id="bubble" role="status" aria-live="polite" hidden>
    <header class="float-bubble-head">
      <small>DEXTER</small>
      <div class="bubble-head-actions">
        <button type="button" class="icon-button" id="snap" title="Snap beside Dexter">⤢</button>
        <button type="button" class="icon-button" id="reset" title="Reset position">↺</button>
        <button type="button" class="icon-button" id="close" aria-label="Dismiss">×</button>
      </div>
    </header>
    <p id="text"></p>
    <div id="choices" class="float-bubble-choices"></div>
    <div class="float-bubble-foot">
      <button type="button" class="link" id="more" hidden>Open conversation</button>
    </div>
  </section>
  <script src="./bubble.js"></script>
</body>
</html>
