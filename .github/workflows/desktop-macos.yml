name: Dexter desktop macOS alpha checks
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-macos.yml', 'app.js', 'index.html', 'styles.css', 'src/**', 'assets/**']
  push:
    branches: ['feature/desktop-overlay-v1-20261031']
    paths: ['desktop/**', '.github/workflows/desktop-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-linux-runtime:
    # Real Electron runtime on Linux under Xvfb, plus a syscall-level egress audit.
    # Not a substitute for macOS behaviour; it catches wiring and privacy regressions fast.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Static checks and unit tests
        working-directory: desktop
        run: npm run check
      - name: Install trace tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace xvfb
      - name: Full runtime smoke with network syscall trace
        working-directory: desktop
        env:
          DEXTER_DESKTOP_SMOKE: '1'
        run: |
          xvfb-run -a strace -f -qq -e trace=connect,sendto,sendmsg,bind -o /tmp/dexter-net.log \
            ./node_modules/.bin/electron --no-sandbox .stage/app 2>&1 | tee /tmp/smoke.log
          grep -q 'DEXTER DESKTOP SMOKE PASS' /tmp/smoke.log
          echo "IP-family socket destinations seen:"
          grep -E 'AF_INET' /tmp/dexter-net.log | grep -oE 'inet_addr\("[^"]+"\)|inet_pton\(AF_INET6, "[^"]+"' | sort | uniq -c || true
          if grep -E 'AF_INET' /tmp/dexter-net.log | grep -oE 'inet_addr\("[^"]+"\)|inet_pton\(AF_INET6, "[^"]+"' | grep -vE '"127\.0\.0\.1"|"::1"'; then
            echo "::error::Non-loopback network traffic observed"; exit 1
          fi
          echo "Egress audit PASS: only loopback (the smoke's own fake model server)."
      - name: Quit and relaunch persistence
        working-directory: desktop
        run: |
          profile=$(mktemp -d)
          for phase in persist-write persist-verify; do
            DEXTER_DESKTOP_SMOKE=1 DEXTER_DESKTOP_SMOKE_PROFILE=$profile DEXTER_DESKTOP_SMOKE_PHASE=$phase \
              xvfb-run -a ./node_modules/.bin/electron --no-sandbox .stage/app 2>&1 | tee /tmp/$phase.log
            grep -q 'DEXTER DESKTOP SMOKE PASS' /tmp/$phase.log
          done

  desktop:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Static and deterministic tests
        working-directory: desktop
        run: npm run check
      - name: Build ad-hoc signed arm64 .app (fails unless strict deep signature verifies)
        working-directory: desktop
        run: npm run package:mac
      - name: Re-verify bundle identity, metadata, icon and every nested signature
        working-directory: desktop
        run: |
          app="out/Dexter Desk Familiar-darwin-arm64/Dexter Desk Familiar.app"
          node scripts/verify-macos.mjs "$app"
          cmp -s .stage/Dexter.icns "$app/Contents/Resources/electron.icns"
          echo "Dexter app icon bytes verified"
      - name: Full runtime smoke of the packaged macOS app
        env:
          DEXTER_DESKTOP_SMOKE: '1'
        run: |
          app="desktop/out/Dexter Desk Familiar-darwin-arm64/Dexter Desk Familiar.app"
          "$app/Contents/MacOS/Dexter Desk Familiar" 2>&1 | tee /tmp/mac-smoke.log
          grep -q 'DEXTER DESKTOP SMOKE PASS' /tmp/mac-smoke.log
          echo "Synthetic in-app checks only. Physical pointer click-through is NOT verified by CI."
      - name: Build, mount, verify, copy out, launch and relaunch the DMG app
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        working-directory: desktop
        run: node scripts/package-dmg.mjs
      - name: Verify DMG SHA-256
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        working-directory: desktop/out
        run: shasum -a 256 -c Dexter_Desk_Familiar_*_macOS_arm64_adhoc.dmg.sha256
      - name: Upload ad-hoc macOS DMG for hands-on review (not notarized)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@v4
        with:
          name: Dexter-Desktop-macOS-arm64-adhoc-DMG-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_number }}
          path: |
            desktop/out/Dexter_Desk_Familiar_*_macOS_arm64_adhoc.dmg
            desktop/out/Dexter_Desk_Familiar_*_macOS_arm64_adhoc.dmg.sha256
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
