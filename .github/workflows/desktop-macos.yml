name: Dexter desktop macOS alpha checks
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-macos.yml']
  push:
    branches: ['feature/desktop-overlay-v1-20261031']
    paths: ['desktop/**', '.github/workflows/desktop-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Static and deterministic tests
        working-directory: desktop
        run: npm run check
      - name: Build unsigned arm64 .app
        working-directory: desktop
        run: npm run package:mac
      - name: Inspect bundle plist and executable
        run: |
          app="desktop/out/Dexter Desk Familiar-darwin-arm64/Dexter Desk Familiar.app"
          test -d "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/Dexter Desk Familiar"
          test -s "$app/Contents/Resources/app.asar"
          echo "Unsigned bundle layout verified. Real desktop interaction not verified."
