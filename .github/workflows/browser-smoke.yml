name: Browser smoke — Dexter
on:
  push:
    branches: [main, 'build/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tooling only
        run: npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.64.1
      - name: Install cloud Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise real browser behavior
        run: npx playwright test --config=playwright.config.mjs
        env:
          CI: 'true'
      - name: Capture synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dexter-browser-failure
          path: test-results/
          retention-days: 2
          if-no-files-found: ignore
